r del globo terráqueo, con una variedad extensa de tipos de pizza los comensales han sabido cómo apreciar excelentemente este manjar.¡Ordena pizza a domicilio con Rappi ahora!\u003c/p\u003e"},"hamburguesas":{"title":"Hamburguesas","text":"\u003cp\u003eSiendo una perfecta alternativa para disfrutar en familia con nuestro delivery a domicilio, con amigos en divertidas salidas y más, la hamburguesa nunca ha fallado en la forma como deleita a los comensales con su explosión de sabor y también contundente manera de poderla apreciar con diversos tipos de salsas en especial su mejor amiga la salsa barbacoa.En Estados Unidos y alrededor del mundo es muy común salir por hamburguesas, siendo así unas de las más sabrosas y estupendas opciones para deshacerse de un desesperante momento con hambre, incluso existen muchísimas hamburguesas que por sin duda alguna podría cómodamente disfrutar, desde delicias como la clásica hamburguesa con queso o llamada por su nombre original \"Classic Bacon Cheese Burger\" a una sorprendente \"Melocotón Caramelizado\".¿Qué esperas? ¡Realiza tu pedido de hamburguesas a domicilio con Rappi ahora!\u003c/p\u003e"},"sushi":{"title":"Sushi","text":"\u003cp\u003eDespués de muchos platillos que nos han encantado desde tiempos inmemorables y la gran variedad de sabores, el sushi sigue siendo uno de los mejores candidatos para poder disfrutar el insuperable sabor japonés teniendo protagonismo en cada rincón del planeta, desde Asia, conquistando Europa, el Medio Oriente y América.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eJapón con su cultura tan espectacular llena de historia y también llena de muchos sabores ha sabido cómo deleitar y también ofrecer experiencias inigualables con su más apreciado platillo llamado \"sushi\", siendo un platillo con una enorme variedad que sigue siendo un fiel representante de toda la cultura japonesa, mencionando que también representa una gran porción de la mejor mano calificada en la cocina ya que es un platillo exageradamente delicado en su preparación. ¡Ordena sushi a domicilio con Rappi ahora!\u003c/p\u003e"},"peruana":{"title":"Peruana","text":"\u003cp\u003eComo se acostumbra de la comida peruana, existe una gran variación de platillos y también postres que siempre han representado muy bien el buen sazón del Perú, sin embargo ha sido capaz de posicionarse contundentemente frente a las mejores gastronomías en el mundo por eso con nuestro delivery a domicilio hacemos que disfrutes en tu casa de esta deliciosa comida que también ha sido una de las favoritas por su extensa diversidad.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eLa comida peruana ha tenido una influencia significante por sus raíces indígenas y europeas, contando con platillos que han tenido modificaciones en los ingredientes y en su preparación, muchas veces se ha catalogado el Perú como uno de los reyes en la comida a base de mariscos o pescados por su mejor representante el \"Ceviche\", plato que consiste en ser una combinación entre pescado blanco, mariscos y añadidos como la cebolla, cilantro y sal para complementar más su sabor  y que sin duda con nuestro delivery podemos hacerte deleitar el sabor de estos platillos desde tu casa.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003ePor el otro lado, el famoso ceviche no es el único platillo que deleita a cada persona cuando decide probar un poco del arte culinario peruano, con un sabroso manjar llamado \"Causa a la Limeña\" que consiste en ser un platillo muy sabroso que se consume mayormente como entrada, se constituye por sus principales ingredientes como la papa siendo su base de preparación, limón, huevo cocido y aceitunas negras aunque también en ocasiones es habitual añadirle pollo, aguacate, atún y lechuga como decoración, en el menú peruano nunca se debe olvidar el infalible \"Ají de Gallina\", un sabroso y cremoso platillo preparado con gallina, también es acompañado con huevos cocidos, arroz y patatas, al igual que otro platillo que representa excelentemente al Perú que se cataloga como \"Lomo Saltado\", consiste en ser carne ternera cocinada junto cebolla morada, ají amarillo, vinagre blanco o tinto, tomate y diferentes tipos de especias. Después de mucha variedad se debe decir que esto no lo es todo, Perú también posee un platillo muy famoso que consiste en ser el \"Arroz Chaufa\", un exquisito arroz frito con pollo, tortilla, también costilla y varios tipos de carnes, suele ser acompañado con bebidas alcohólicas o también diferentes tipos de bebidas refrescantes siendo así un plato fuerte como la icónica \"Brasa\" peruana que no tiene nada que envidiarle al arroz chaufa, la brasa teniendo un exquisito sabor a emparrillado suele ser carne o pollo cocinada en barras de hierro al carbón siendo una de las mejores experiencias que puede ofrecer la comida peruana. ¡Ordena comida peruana a domicilio con Rappi ahora!\u003c/p\u003e"},"asiática":{"title":"Asiática","text":"\u003cp\u003ePlatos exóticos, unos muy fuertes de sabor, otros gentiles, también existen frutos que son muy pocos vistos, simplemente una infinidad de sabores desconocidos que ofrece la gastronomía asiática.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eDespués de saber del legendario Sushi, Arroz chino o Chop Suey, habrían demasiadas opciones con la que podría deleitarse, platillos como: Kusaya que es acompañada con sake y shochu por los japoneses aunque los más tradicionales prefieren hacerlo con Shima Jiman que consiste en una bebida típica de Japón, entre otras opciones existe el Pad Thai que se denomina como uno de los platillos más sorprendentes y deliciosos de la cocina tailandesa, con ingredientes principales como el pollo, fideos de arroz o gambas, huevo, pimiento rojo, brotes de soja, salsa de pescado y salsa de tamarindo, nunca se debe olvidar de un fiel Roti Canai que es un tradicional platillo malayo, un picante Nasi Padang que incluye carnes, pescados, verduras y diferentes pimientos, mucho menos se debe dejar desapercibida la infalible y artística Sopa de nido de ave.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eTambién existen postres que mantienen a la gastronomía asiática como una de las más interesantes en el mundo, con solamente mencionar sus postres como el Pastel de nata que suele ser un tentempié magnífico para compartir entre familia, luego una ensalada de frutas tropicales donde forma parte la fruta del dragón, y por último el postre \"loco\" de Taiwán que contiene calabaza y jalea de hierba añadida con trocitos de hielo, trocitos de batata y taro. ¡Ordena comida asiática a domicilio con Rappi ahora!\u003c/p\u003e"},"pastelería y postres":{"title":"Pastelería y Postres","text":"\u003cp\u003eSi estas con un antojo de algo dulce en Rappi tenemos los mejores lugares para que disfrutes de postres y productos de pastelería de alta calidad. Los postres no son solamente pasteles o crema pide manjares como: Cheese Cake endulzado con miel de agave y jalea de frutos rojos siempre perfecto para disfrutarlo después de una comida contundente, no podemos olvidar el \"Mil Sabores\" o glorioso \"Mil Hojas\" muy exótico y lleno de sabor, este pastel consiste en dos capas suaves de crema y tres galletas feite horneadas, también decorado con crujientes y doradas coronas en el tope para resaltar su rica estética, por otro lado para los amantes de la pastelería pueden pedir el tradicional \"Tres Leches\", una increíble combinación entre leche evaporada, condensada y entera que le ofrece una contextura inigualable. Aunque no lo es todo, existe otra opción muy amada por los pasteleros, se trata del Pastel Alemán que consiste en un pastel de chocolate en capas relleno y cubierto de crema de coco o frutos secos. ¡Anímate a probarlos! realiza tu pedido a domicilio con Rappi ya!\u003c/p\u003e"},"mexicana":{"title":"Mexicana","text":"\u003cp\u003eDespués de las famosas empanadas argentinas, de los míticos sándwiches chilenos, el manjar de mariscos del Perú, podremos echarle un vistazo a una de las gastronomías más respetadas por los críticos a nivel global y que en chile con nuestro servicio de delivery a domicilio la podemos llevar a la puerta de tu casa.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eAsí es, se trata de la gastronomía mexicana que se caracteriza por su sabor excéntrico y picoso, también gentil o extremadamente delicioso en alguno de los casos. México con una gran variedad de platillos como: el tradicional y clásico taco que puede ser relleno de carne molida, carne mechada, también pollo y complementada con una excelente salsa picante hecha con pimientos verdes y rojos, el delicioso burrito que consiste en ser una tortilla hecha a base de harina de maíz, enrollada conteniendo cada ingrediente que hace que este platillo sea uno de los favoritos en la gastronomía mexicana, puede contener carne, pollo y diversos pimientos para el toque ardiente, también queso cheddar acompañado con una ensalada de lechuga, tomate y cebolla, aun así se puede disfrutar de una excelente torta de jamón para el desayuno.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eEste platillo suele ser conocido por la serie infantil \"El Chavo del 8\" por ser la comida preferida del protagonista, consiste en ser un sándwich de jamón y queso acompañado con una ensalada fresca o aguacate, también se le puede dar un gusto al paladar una carne a la \"Tampiqueña\" servida con dos enchiladas de mole, rellena de pollo, arroz, porotos y un infalible guacamole tradicional. ¡Ordena comida mexicana a domicilio con Rappi ahora!\u003c/p\u003e"},"árabe":{"title":"Árabe","text":"\u003cp\u003eEl Medio Oriente siempre ha sido una parte del mundo muy misteriosa y un poco compleja de entender, en cambio en su gastronomía siempre ha sido uno de los líderes por el número de estupendas experiencias que ofrecen en cada platillo, pequeños manjares como sus croquetas o falafel como mayormente se le conoce alrededor del mundo nunca fallan al representar a una cultura llena de historia y deliciosos sabores que adicional puedes solicitar delivery a domicilio cuando quieras con Rappi.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eEncontrá una amplia variedad de restaurantes especializados en comida árabe en Rappi y deléitate con platillos como: el infalible Hummus de garbanzo que sirve como base y fiel acompañante de la carne de res con cebolla y un puñado de almendras tostadas, delicioso Plato Berenjena que viene rellena de carne y arroz, Al-Hayar que consiste en ser una shawarma de pollo tipo stroganoff aderezado en salsa de champiñones y acompañado por arroz de frutos secos, vino, yogurt griego y menta, también el plato shawarma con su explosivo sabor que ofrece con la carne y pollo cocinada a la plancha representando muy bien la gastronomía árabe, por último el famoso y nunca infalible Doner que siempre ha deleitado a los comensales con su carne y pollo proveniente de la shawarma sólo que servida en pan de pita incluyendo sus vegetales frescos ,también suele ser acompañado con una salsa o crema de yogurt y bebidas exóticas tradicionales del Medio Oriente. ¿Qué esperas? ¡Realiza tu pedido con Rappi ahora!\u003c/p\u003e"},"saludable":{"title":"Saludable","text":"\u003cp\u003eMuchas personas tienen en mente que comer sano sólo es alejarse de las delicias y resulta no ser así, cuando se trata de comer saludable tampoco se trata de quedarse con hambre o simplemente decirle adiós a los alimentos que más nos deleitan.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eHoy podés pedir en una amplia gama de restaurantes especializados en comida saludable una excelente variedad de ideas para comer saludablemente mientras se hace un balance entre lo delicioso y sano para nuestro organismo sencillamente dándole un vistazo a platillos como: El Gourmet de Pollo que contiene una pechuga de pollo a la plancha, arroz blanco, un mix de vegetales salteados o a la parrilla y también con tortillas, esta alternativa no es la única cuando se trata de comer excelentemente bien, también existe la opción de privarse con \"La Cubana\", se trata de un tipo de ensalada que sigue siendo un éxito en la gastronomía latinoamericana siendo una de las mejores comidas saludables para disfrutar en cualquier lugar y en cualquier momento por su contenido, consiste en un mix de lechugas orgánicas, arroz jazmín o quínoa, pollo mojo, frijoles cubanos, rico pico de piña, tajadas, guacamole o un especial aderezo con el nombre de \"marañón-limón\", tampoco podemos olvidarnos de un Bowl de Matcha que viene con un plátano, espinaca, matcha pura y agua de coco, también para los amantes de los mariscos se encuentra el mítico Ceviche que contiene múltiples alternativas e ingredientes nutritivos para la salud. ¿Cuidarse? ¡Empieza ya pidiendo a domicilio con Rappi!\u003c/p\u003e"},"italiana":{"title":"Italiana","text":"\u003cp\u003eEn nuestro servicio poseemos variedades infinitas de restaurantes italianos para apreciar lo deliciosa y magnífica que es la gastronomía de ese país, reconociendo su historia y excelente desenvolvimiento en la gastronomía global catalogada como una de las culturas más apreciadas. Incluyendo en nuestro menú las más emblemáticas pizzas y pastas que podrías disfrutar cuando desees incluso con tu pedido a delivery.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eDeléitate con platillos como: lasaña de espinaca con queso fresco y una exquisita salsa de champiñones, como también la clásica lasaña de carne de res, espagueti aderezado con salsa boloñesa y una pizca de pimienta negra, tampoco olvidemos la importante lasaña de jamón y queso mozzarella aderezada con una infalible salsa bechamel y los Ravioli rellenos de carne incluyendo otras especias que tampoco faltan en representar fuertemente a la elegante cultura italiana.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eAunque esto no es todo, también existe lo posibilidad que disfrute una buena pizza clásica de pepperoni solicitada por muchos comensales con nuestro servicio delivery, una rústica Pizza Carnívora acompañada con sus bebidas favoritas, deliciosa Pizza Napolitana con aceitunas negras y un toque de aceite de olivos, además es imposible olvidarse de la clásica Pizza de jamón fresco y mozzarella, también la pizza especial que consiste en una mezcla de jamón con un toque de pimientos negros, aceite de olivos, champiñones, anchoas, pepperoni o salame, pimentón, tomate y entre otros ingredientes ya lista para compartir en familia. ¿Qué esperas? ¡Realiza tu pedido con Rappi ahora!.\u003c/p\u003e"},"desayunos":{"title":"Desayunos","text":"\u003cp\u003eSiempre es adecuado mantener una buena alimentación y si lo llevan con servicio a domicilio mucho mejor, sin embargo el desayuno es catalogado como la comida más importante del día ya que proporciona un gran porcentaje de energía que en su efecto nos hace sentir de una manera más activa y también más eficientes para poder concretar las tareas pautadas en el día a día.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eEntre los lugares que ofrece Rappi que hacen delivery a domicilio de desayunos encontrarás el encanto del mítico desayuno a la \"Inglesa\" que también puede pedir delivery y puede estar a disposición para ti con nuestro servicio de delivery, y consiste en ser pancetas acompañadas con huevos, salchichas y también judías junto a una taza de té o delicioso café, aunque también existe el famoso \"Galileo\" proveniente de Israel, catalogado como un desayuno fuerte y lleno de nutrientes, este desayuno nunca es infalible para comenzar un día lleno de energía por su variedad de ingredientes que lo componen, consiste en un pescado al estilo escabeche, huevos, ensalada y diferentes tipos de quesos dependiendo de la decisión del comensal, luego de estos ricos desayunos puede encontrarse un candidato muy exótico llamado \"Hafragrautur\", platillo típico islandés que consiste en ser trozos de gachas a base de avena con azúcar morena espolvoreada, este desayuno suele acompañarse habitualmente con una taza de café o leche caliente.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e \u003cp\u003eMás lejos, al otro lado del globo terráqueo se encuentra un manjar exquisito llamado \"Jjigae\", de origen surcoreano consiste en ser un desayuno bastante saludable pero con un toque picante, se trata específicamente de una diversidad de caldos acompañados con salsas a base de pimientos, aparte también se conoce las \"Tortitas\" canadienses que son unas delicias servidas con sirope de arce, y por último el mítico \"Changua\" colombiano que se trata de un caldo que lleva leche, huevos, cebolla, sal y cilantro siempre servido con un tipo de pan llamado \"calado\". ¿Qué esperas? ¡Realiza tu pedido de desayunos a domicilio con Rappi ahora!.\u003c/p\u003e"},"sándwiches":{"title":"Sándwiches","text":"\u003cp\u003eSiempre habrá un día donde necesitamos algo ligero, sabroso y también saludable, por eso en nuestro menú siempre hemos apreciado el arte del Sándwich con nuestros servicios delivery, ofrecemos múltiples alternativas con las que podría disfrutar un buen desayuno, como también un buen brunch para complementar el almuerzo.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003ePodría deleitarse con un Sándwich clásico de jamón y queso acompañado con ensalada césar, también aros de cebolla y sus bebidas favoritas, sin olvidarse del mítico Sándwich Marciano que incluye una variedad de carne, también cerdo y pechuga de pollo aderezada con salsa barbacoa, también existen las opciones saludables y livianas como \"Los Livianitos\" que consiste en un sándwich preparado con queso mozzarella, tomate, hojas de albahaca y pesto, muy similar a los \"Flats\" con un pan de pita, jamón serrano, queso manchego y pasta tumaca, tampoco podemos olvidar el mítico sándwich con pan pretzel relleno con chorizo, queso turrialba y gallo pinto, este platillo es uno de los más exóticos por su rareza en la combinación de diferentes panes, puede ser mixto o solamente disfrutar con pan de pita acompañado con diferentes aderezos como mermelada o también múltiples salsas para brindar una explosión de sabores increíbles. ¿Hambre? ¡Realiza tu pedido a Rappi ya!\u003c/p\u003e"},"pescados y mariscos":{"title":"Pescados y Mariscos","text":"\u003cp\u003eNunca es tarde para disfrutar de las grandiosas variedades de pescados y mariscos para recordar el buen sabor del océano, de conocer platillos como el famoso ceviche o el mítico manjar de mar podemos seguir disfrutando grandes cantidades de alternativas para extender nuestro paladar con nuevos sabores provenientes de la vida marina que puedes tener en tu casa con nuestro servicio de delivery a domicilio cuando gustes.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003ePlatillos deliciosos como: un mix de camarón grande acompañado con filete empanizado, ceviche de pescado infalible para compartir en familia, camarón macuil, excelente ensalada de cangrejo y un buen caldo de camarón pueden ser los apropiados para deleitar nuestros paladares. De tantos platillos estos no los son todo, también existe la \"mariscada\" con su variedad de ingredientes como el pulpo, camarones, filete, surimi servido con arroz, ensalada, vegetales al vapor y crujiente pan, tampoco podemos olvidar el caldo de mariscos siendo un deleite con su mix de almejas, filete, jaiba, el mencionado surimi, callo de almeja y camarón siempre comido con néctar de limón.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eAdemás encuentra en el menú de nuestra amplia variedad de restaurantes especializados en pescados y mariscos, un exótico taco de Cahuamanta que forma parte de una de las opciones más deliciosas para disfrutar los mariscos, este plato lleva mantarraya cocinada con verduras y también incluyéndose para acompañar, por lo visto no podemos dejar afuera el mítico ceviche clásico con cebolla, chile verde, pescado y acompañado con pepino además de bebidas exóticas. ¡Anímate a probar pide con Rappi!\u003c/p\u003e"},"comida casera":{"title":"Comida Casera","text":"\u003cp\u003eEn ocasiones se suele disfrutar de muchísimos restaurantes y también de mucha comida rápida que olvidamos lo importante que es considerar el arte de la comida casera como guisos, ensaladas, emparedados, infinidades de platillos que deleitan a nuestra familia cuando se elaboran, sin embargo nunca está demás saborear las especialidades de la casa y lo mejor es que te la puedan llevar a tu casa con servicio de delivery a domicilio.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eEn el menú de los restaurantes que ofrecen este tipo de comida, podría encontrarse con una excelente Sopa de Menudencias que es excelente para una tarde en bajas temperaturas, siempre acompañada con tajadas y arroz, aunque existe también la Cazuela Montañera como unas de las mejores delicias caseras que en ciertas ocasiones nuestros abuelos acostumbraban servirnos a la hora del almuerzo, este platillo consiste de la combinación de frijoles, carne molida y maduros en solamente un plato de comida que en realidad resulta ser un plato muy recomendado para reponer las energías utilizadas durante el día a día. Luego de cazuelas y sopas, es probable que se le antoje algo diferente como una buena pechuga de pollo con ensalada césar y arroz acompañada con su bebida favorita o también lentejas con chorizo y cilantro, tampoco olvidemos un platillo catalogado como uno de los favoritos por la comunidad vegetariana global que es la Lasaña Veggie, un platillo que consiste en ser saludable y sabroso conteniendo vegetales a la parrilla, quínoa y queso mozzarella con un toque de aceite de olivos para resaltar su concentrado sabor. ¡Realiza tu pedido con Rappi ahora!\u003c/p\u003e"},"café":{"title":"Café","text":"\u003cp\u003eDescubierto en el norte de Etiopia y utilizado como medicina en los años 900 A.C ha sido una de las sustancias más consumidas alrededor del mundo y en la historia, sin embargo después de conocer sus propiedades estimulantes el café sigue teniendo un gran protagonismo en las bebidas calientes conformando así exquisitas maneras para beberlo y disfrutarlo con nuestro servicio de delivery a domicilio te lo llevamos bien caliente a la puerta de tu casa.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eEn el menú de las cafeterías que puedes elegir en Rappi podrías encontrar variados tipos de café, tales como: el café \"Expresso\" como una variable de las más antiguas existiendo desde el 1906, consiste en ser un café con un sabor fuerte y aromático servido con espuma, podemos mencionar también el café \"Americano\" que en su caso es un café adoptado por los estadounidenses, se caracteriza por tener un sabor ligero y no tan fuerte a diferencia del expresso, también se encuentra el \"Cappuccino\" que consiste en un café combinado entre el expreso, espuma o leche evaporada a partes iguales, este café es muy famoso en las cafeterías por su exquisito sabor suave y cremoso perfecto para ser acompañado con tostadas, postres o hasta un gran desayuno ligero, no podemos olvidarnos del mítico café \"Latte\" como uno de los favoritos en cualquier cafetería del mundo, consiste en ser un tipo de café con 2 onzas de café expresso y 3 onzas de leche al vapor aunque en ocasiones es servido con crema o caramelo encima.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003ePor el otro lado, existe también un tipo de café llamado \"Moka\" que deleita a sus comensales con su unión entre el café y chocolate, siempre es perfecto como complemento para los clásicos croissant, por último se conoce el famoso \"Caramel Macchiato\" siendo una excelente combinación entre el expresso, crema, leche evaporada, caramelo o también vainilla para ofrecer un toque extra y especial. ¡Realiza tu pedido con Rappi ahora!\u003c/p\u003e"},"internacional":{"title":"Internacional","text":"\u003cp\u003eSaber los platillos típicos del mundo es igual de importante que saber el platillo más icónico en cada nación que existe, el mundo con una gastronomía global súper variada ofrece múltiples sabores, sazones y hasta maneras tradicionales también como modernas para cocinar y expandir el arte culinario en cada continente.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eEn chile nuestro servicio de delivery a domicilio es muy eficiente para facilitarte las más exquisitas experiencias culinarias que ofrece la comida internacional.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eLos platos ya catalogados como los típicos globalmente han sido muy importantes, ni mucho menos hay que subestimar los platos que no han sido parte del club \"comida típica internacional\". En el menú internacional puede disfrutarse la tradicional Paella española hecha con arroz, mariscos y conejo, la especialidad de Austria \"Wiener Schnitzel\" que se trata de escalopes de ternera rebozados con harina, huevo y pan molido que suelen freírse en una sartén.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eLuego una emblemática pizza como icono italiano, el Mole mexicano con su variedad de ingredientes y explosión de sabores, el \"Fish and Chips\" británico siendo frituras de pescado y papas fritas acompañadas con ketchup, Pollo Tandoori de la India con una combinación de especias y yogurt, Papa a la huancaína que representa al Perú, infalible Salchicha alemana, tradicional Curanto de Chile contando con una sazón inolvidable e increíble, clásica americana hamburguesa de carne y queso americano, el fiel representante japonés \"Sushi\", tampoco hay que perderse el Nasi Gareng de Indonesia con su mezcla de sabores excéntricos, un rústico platillo de Costa Rica \"Gallo Pinto\", otra especialidad asiática originada de la gigante China \"Dim Sum\" que consiste en un platillo siempre acompañado especialmente con té, por último el falafel que representa fuertemente el Medio Oriente. ¿Qué esperas para expandir tus horizontes? ¡Realiza tu pedido de comida internacional con Rappi!\u003c/p\u003e"},"americana":{"title":"Americana","text":"\u003cp\u003eDesde tiempos inmemorables la gastronomía americana ha tenido cierto protagonismo, años adoptando diferentes culturas por la mezcla de habitantes en los Estados Unidos se ha podido conocer una excelente infinidad de platillos que han modificado la cocina americana para siempre, no solamente hamburguesas sino también comida china, guisos y asados.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\n\n\u003cp\u003ePuede disfrutar una muy buena variedad de la fabulosa y distinta gastronomía americana empezando con una sabrosa hamburguesa de carne ternera, tocino, ensalada de lechuga con tomates, queso americano acompañado con jalapeños, pepinillos y también bebidas múltiples, no podemos olvidar de las famosas Alitas de tocineta que es un platillo muy típico en los Estados Unidos, consiste en ser alitas envueltas con tocino mientras son bañadas de salsa Daytona, salsa Ranch o acompañadas con queso azul, también existe un exquisito platillo llamado papas \"Chili\" con carne que suele ser acompañado con queso fundido.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\n\n\u003cp\u003ePor ahora solamente se sabe una pequeña porción de una gastronomía muy mixta, en las demás opciones existen las costillas, algo sencillo pero contundente en su sabor siendo acompañadas con chorizo, lomo de res, lomo de cerdo, contramuslo, papa cocida con salsa Sour Cream y chimichurri, no olvidemos los deliciosos e infalibles \"Hot Dogs\" perfectos para pasar un rato excelente, acompañados siempre con salsa barbacoa o salsa de queso. ¿Todavía no ha hecho su orden? ¡Realiza tu pedido con Rappi ya!\u003c/p\u003e\n"},"vegetariana":{"title":"Vegetariana","text":"Si tenes ganas de comer algo rico, entonces Rappi te lo lleva en minutos a tu casa. Elegí entre los mejores restaurantes y solo preparate para disfrutar de tu comida favorita en casa. Solo tenes que ingresar a Rappi, elegir tu restaurante favorito y vas a poder junto a amigos, familia o tu pareja; disfrutar de un momento es
