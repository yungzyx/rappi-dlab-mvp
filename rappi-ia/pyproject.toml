[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rappi-ia"
version = "1.0.0"
description = "Conceptos, embeddings, búsqueda híbrida por vertical, agente de recomendaciones y analítica sobre el catálogo de Rappi Chile"
readme = "README.md"
requires-python = ">=3.13"  # la del CI, Docker y los .venv
dependencies = [
    "rappi-scraper",  # esquema y migraciones de la base (se instala desde ../rappi-scraper)
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "numpy>=1.26",
    "requests>=2.31,<3",  # cliente de Jev
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "torch>=2.5"]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.121", "uvicorn[standard]>=0.30", "psycopg-pool>=3.2,<4"]
dev = ["pytest>=8", "ruff==0.17.1", "httpx2>=2.13"]

[project.scripts]
rappi-ia = "rappi_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rappi_ia.concepts" = ["*.toml", "*.csv"]
"rappi_ia.eval" = ["*.json"]
"rappi_ia.offers" = ["*.toml"]
"rappi_ia.agent" = ["*.toml"]
"rappi_ia.motor" = ["*.toml"]
"rappi_ia.analytics" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Patrón estándar de FastAPI: Depends/Query/File/Form como valores por defecto.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
