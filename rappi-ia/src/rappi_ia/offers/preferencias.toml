# Preferencias explícitas que el agente recuerda (tabla `agent_preferences`, migración 045). Las opciones de dieta y
# alergias son datos: agregar una es escribirla aquí. offers/preferences.py las valida al cargar.
#
# Una dieta o alergia solo filtra lo que el agente muestra (respuestas, sugerencias y ofertas), y solo en lo que es
# comida (los grupos de `comida`, los platos y lo que no tiene concepto). Nunca es la razón de una oferta y no entra a
# segmentos, perfiles, motor ni panel. Como se filtra por el nombre, el agente lo dice al mostrar comida: hay que
# revisar los ingredientes en la tienda.
#
# - `tipo`: dieta o alergia (las intolerancias van como alergia, como en la app de Rappi).
# - `nombre`: cómo se muestra («Vegetariano»); `sin`: lo que el agente dice que saca («carne»).
# - `frases`: cómo se dice por chat, sin tildes ni mayúsculas, al comienzo del mensaje («soy vegetariano»). Con «ya no»
#   delante, se quita.
# - `conceptos`: lo de esos conceptos sale, salvo que el nombre diga `salvo`.
# - `palabras`: lo que tiene una de esas palabras (o frases) en el nombre sale, salvo que el nombre diga `salvo`. Se
#   comparan enteras y sin tildes ni ñ («mani» es «maní»).
# - `salvo`: expresión regular sobre el nombre sin tildes ni ñ: lo que la calza queda («Pizza vegetariana»).
#
# No está la dieta kosher de la app de Rappi: ningún nombre del catálogo lo dice, así que filtrar sería no mostrar nada.

# Los grupos de la taxonomía (concepts/taxonomy.toml) que son comida, y las cocinas que se pueden marcar como favoritas
# (conceptos de comida preparada, como las opciones de la app de Rappi: sushi, pizza, poke, mexicana, postres…).
grupos_comida = ["alcohol", "bebidas", "snacks", "dulces", "despensa", "frescos", "comida"]
cocinas = [
    "sushi", "pizza", "hamburguesa", "ensaladas-bowls", "mexicana", "peruana", "asiatica", "arabe", "latina",
    "sandwiches", "empanadas", "postres",
]

