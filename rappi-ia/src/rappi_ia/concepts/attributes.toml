phrases = ["sin gluten", "libre de gluten", "gluten free", "sin tacc", "libre de tacc", "apto celiacos", "para celiacos", "no contiene gluten"]
negations = ["contiene gluten", "con gluten", "trazas de gluten", "puede contener gluten"]

