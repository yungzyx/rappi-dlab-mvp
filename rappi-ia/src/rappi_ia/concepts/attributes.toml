# Atributos de ítem (capa de perfiles, docs/diseno/2026-10-06-capa-perfiles-design.md §4.1).
#
# Cada atributo se detecta, en este orden de confianza (gana la primera fuente que responde):
#   1. `rappi`: campos de `catalog_items.attributes`. `keys` lista los nombres posibles del campo; sin `values` el campo
#      es una bandera (true = lo tiene; un `false` explícito BLOQUEA las frases); con `values`, el atributo se marca si
#      el campo trae alguno de esos valores.
#   2. `phrases`: frases (sin tildes, palabras enteras) en el nombre, la categoría y la descripción hasta las
#      advertencias del prospecto. Si aparece alguna de `negations` («contiene gluten») el atributo se descarta.
#   3. `derived = true`: se calcula por SQL (precio, descuento, marca propia), no tiene frases.
# `applies_to`: catalog_item (productos), menu_item (platos) o both. `value_type`: flag.
# Para agregar un atributo basta una fila aquí y `make layers`; la versión se copia a `rules_version`.

version = "2026-10-06"

