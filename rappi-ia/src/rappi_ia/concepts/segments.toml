# Segmentos de usuario por comportamiento (docs/diseno/2026-10-06-capa-perfiles-design.md §4.2 y §5).
#
# Cada regla combina piezas genéricas; el motor (layers/segments.py) no conoce segmentos por nombre.
# Contenido (basta una): concepts, groups, attributes, brands, occasions, services, query_words. Ninguna regla usa
# `occasions`: una ocasión agrupa conceptos cotidianos (chocolate, café, cerveza) y volvía «estudiante» o «regalador» a medio mundo.
# Contexto (todas): verticals, hours [desde, hasta] (puede cruzar medianoche), weekdays (1 = lunes), days_of_month,
# price_percentile { gte | lte }, discount, basket_size { gte_items | lte_items | gte_amount }, modality,
# from_suggestion, cities. `min_share` (0 a 1): parte mínima de la actividad de la persona, en los tipos de evento de la
# regla, que debe calzar: un contexto que cualquiera cumple de vez en cuando (un fin de semana) no es un perfil.
# Una regla con `metric` { name, min?, max?, stronger? } no suma eventos: la persona es del segmento si min ≤ valor < max;
# con `stronger = "lower"` (nuevo, activo, gasto-bajo…) un valor menor es más fuerte y los niveles decrecen.
# Los sensibles se nombran por lo que la persona compra (nunca por una condición) y llevan `sensitive = true`.
# Las palabras de consulta van en minúsculas y sin tildes: el motor normaliza antes de comparar.
version = "2026-10-06"

[defaults]
window_days = 120
half_life_days = 45.0
min_signals = 3
levels = { bajo = 2.0, medio = 5.0, alto = 10.0 }
events = { order_line = 3.0, cart_add = 1.5, search = 1.0, chat = 1.0, ask = 1.0, view_item = 0.3 }

