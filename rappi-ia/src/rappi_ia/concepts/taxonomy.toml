# Taxonomía propia de conceptos (capa 2). Estable: los pasillos y categorías de Rappi cambian; el concepto no.
#
# - `id` es estable (slug ASCII). `parent` apunta al grupo.
# - `keywords` se usan para reglas sobre nombres de productos, platos y consultas. Se escriben con tildes
#   y se normalizan al cargar (sin tildes ni ñ, minúsculas). Una palabra suelta también calza su plural
#   (s/es); las frases calzan completas. Evitar palabras ambiguas (collar, arnés, papel, filtro, tenis).
# - `sensitive = true`: el agente nunca lo sugiere por iniciativa propia (solo responde si se lo piden). Sus keywords no
#   pueden ser palabras de uso común («puro», «pipa», «lubricante»): el plato o el utensilio quedaría oculto como sensible.
#   Su nombre de una sola palabra («Medicamentos») tampoco asigna productos (concepts/assign.py).
# - `query_keywords`: palabras que sirven para pedir el concepto en una consulta, pero que no asignan productos
#   («lubricante» pide bienestar sexual; «Lubricante para lentes» no lo es). En las consultas también cuenta el nombre.
#   Una palabra suelta de estas solo cuenta si es todo el pedido: «lubricante wd-40» no pide bienestar sexual.
# - `product_keywords`: lo contrario; asignan productos del catálogo pero no leen consultas. Para palabras que en un
#   producto nombran el concepto y en una consulta piden otra cosa: «Panko Blanco 1 kg» es despensa asiática, pero
#   quien escribe «panko roll» pide sushi. Tampoco nombran el plato de un menú (concepts/assign.py).
# - `age_restricted = true`: +18; la respuesta lleva el recordatorio.
# - `prepared = true` (en el grupo o en el concepto): se pide hecho, así que también se busca en restaurantes.
#   El resto nunca compite en restaurantes aunque sus locales lo tengan (gaseosas, papas fritas en combos).
# - `broad = true`: agrupa productos de varios tipos («picoteo», «desayuno»). Donde el vertical no lo vende, la búsqueda
#   no exige que el nombre del producto diga lo pedido (agent/tools._focus).

