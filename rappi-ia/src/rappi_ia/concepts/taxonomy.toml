emoji = "🍹"
age_restricted = true
# «cocktelería» es una sección de tragos con otra ortografía. Desde «tom collins», los cócteles que los menús nombran
# sin decir alcohol (base real del 22-10-2026). Fuera, los que en los menús, el catálogo o una búsqueda son otra cosa:
# «vaina» (porotos, vainilla, espadas), «algarrobina» (un jarabe), «mule» (tazones de cobre), «negroni» (salames y
# tomates), «chilcano» (una sopa), «manhattan» (hamburguesas), «cola de mono» (té y helado), «piña colada» (jugos y
# helados), «terremoto» y «michelada» (helados, salsas). Esos los bloquean las guardias de ofertas por el nombre del
# plato, y la vaina y la algarrobina de un menú quedan como alcohol por su sección.
keywords = ["cóctel", "coctel", "cocktail", "cocktelería", "hard seltzer", "seltzer", "mojito", "margarita", "spritz", "ready to drink", "tom collins", "daiquiri", "daikiri", "caipiriña", "caipirinha", "caipiroska", "bloody mary", "cuba libre", "kir royal", "ruso blanco", "ruso negro", "cosmopolitan", "clavo oxidado"]
# «qué trago me recomiendas»: pide alcohol por su nombre (se busca, con +18); sin esto era la ayuda.
query_keywords = ["trago", "tragos"]
# Score es una marca de energéticas: «Score Mojito» no es un mojito.
avoid = ["score"]

