# El MVP en un servidor Linux: Postgres + pgvector, la migración con respaldo, la API, Caddy (TLS y puerta de acceso)
# y los trabajos del operador (perfil `jobs`). Desde la raíz del repo, con el archivo de entorno enlazado como
# deploy/.env (docker compose lo lee para armar este archivo: DOMAIN, la puerta y las URLs de cada servicio):
#   ln -s /etc/rappi/rappi.env deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build
# (o `--env-file /etc/rappi/rappi.env` en cada comando). RAPPI_ENV_FILE cambia el archivo que reciben los contenedores
# (env_file): tiene que ser el mismo.
# Solo Caddy publica puertos (80 y 443): la base y la API quedan en la red interna del stack.
#
# Primer despliegue: el catálogo llega por un dump que copia el usuario, restaurado como rappi_owner antes de levantar
# la API (`pg_restore --no-owner --no-privileges`; ver docs/despliegue.md).

name: rappi

x-env: &env
  env_file: ${RAPPI_ENV_FILE:-/etc/rappi/rappi.env}

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

# El archivo de entorno lleva las claves de todos los servicios. Cada uno recibe solo las suyas: las demás se vacían
# aquí (`environment` gana sobre `env_file`). Si alguien leyera el entorno de la API no tendría la clave del dueño de
# las tablas, la del superusuario ni las de los respaldos. Caddy, el único expuesto a internet, ni siquiera lee el
# archivo: recibe solo DOMAIN y la puerta. Una clave nueva en el archivo va también en la lista que corresponde.
x-sin-claves-de-base: &sin-claves-de-base
  POSTGRES_PASSWORD: ""
  RAPPI_OWNER_PASSWORD: ""
  RAPPI_API_PASSWORD: ""
  DATABASE_URL_OWNER: ""
  DATABASE_URL_API: ""

x-sin-claves-de-la-app: &sin-claves-de-la-app
  API_SECRET: ""
  ANTHROPIC_API_KEY: ""
  TYPESAFE_API_KEY: ""

# restic y las credenciales de su almacenamiento (S3, B2): solo para el servicio jobs.
x-sin-claves-de-respaldo: &sin-claves-de-respaldo
  RESTIC_REPOSITORY: ""
  RESTIC_PASSWORD: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  B2_ACCOUNT_ID: ""
  B2_ACCOUNT_KEY: ""

services:
  db:
    <<: [*env, *logging]
    image: pgvector/pgvector:0.8.7-pg17-trixie  # la misma en el CI y en `make db-docker`
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=50"]
    # Memoria compartida (Docker da 64 MB): pgvector arma los índices HNSW en paralelo con maintenance_work_mem en ella
    # (1 GB al restaurar el dump y en HNSW_MAINTENANCE_WORK_MEM); con menos, el índice falla («No space left on device»).
    shm_size: 2g
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo la primera vez (volumen vacío): crea rappi_owner y rappi_api y las extensiones.
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    environment:
      <<: [*sin-claves-de-la-app, *sin-claves-de-respaldo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$${POSTGRES_DB:-rappi}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Respalda (si hay migraciones pendientes), migra y da los permisos de rappi_api.
  migrate:
    <<: [*env, *logging]
    image: rappi-jobs
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: jobs
    command: ["rappi-ia", "deploy-migrate"]
    environment:
      <<: [*sin-claves-de-base, *sin-claves-de-la-app, *sin-claves-de-respaldo]
      DATABASE_URL: ${DATABASE_URL_OWNER:?Falta DATABASE_URL_OWNER en el archivo de entorno}
      DB_API_ROLE: rappi_api
      TZ: America/Santiago  # el nombre del respaldo de antes de migrar, en la hora de los timers
    volumes:
      - rappi-data:/data
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*env, *logging]
    image: rappi-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: api
    environment:
      <<: [*sin-claves-de-base, *sin-claves-de-respaldo]
      TYPESAFE_API_KEY: ""  # Jev solo corre en jobs
      DATABASE_URL: ${DATABASE_URL_API:?Falta DATABASE_URL_API en el archivo de entorno}
      API_ENV: production
      API_CORS_ORIGINS: https://${DOMAIN:?Falta DOMAIN en el archivo de entorno}
      API_REQUIRE_SEMANTIC: "1"  # sin el modelo cargado, /health da 503: la API no está lista
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s
    restart: unless-stopped

  web:
    <<: *logging
    image: rappi-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_DEMO: ${VITE_DEMO:-}
        WITH_PANEL: ${WITH_PANEL:-0}
    # Sin env_file: solo lo que lee el Caddyfile, desde el archivo de entorno de compose (deploy/.env o --env-file).
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en el archivo de entorno}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Falta BASIC_AUTH_USER en el archivo de entorno}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Falta BASIC_AUTH_HASH en el archivo de entorno}
    # Corre sin root (Dockerfile.web): de las capacidades solo le queda la de abrir los puertos 80 y 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - caddy_data:/data  # certificados y la CA interna: si se pierden, Caddy pide certificados de nuevo
      - caddy_config:/config
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  # Trabajos del operador, a pedido: `docker compose -f deploy/docker-compose.yml run --rm jobs rappi-ia <comando>`.
  jobs:
    <<: [*env, *logging]
    profiles: ["jobs"]
    image: rappi-jobs
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: jobs
    environment:
      <<: *sin-claves-de-base
      DATABASE_URL: ${DATABASE_URL_OWNER:?Falta DATABASE_URL_OWNER en el archivo de entorno}
      # La tarea semanal no migra (sin respaldo): solo revisa; las migraciones las aplica el servicio migrate.
      API_ENV: production
      # Los registros, ultimo-estado.txt y los nombres de los respaldos en la hora de Chile, la de los timers de systemd.
      TZ: America/Santiago
    # Un init (tini) como PID 1: reenvía las señales (systemctl stop, docker stop) y recoge procesos, así bash corre sus
    # traps como en cualquier equipo.
    init: true
    volumes:
      - rappi-data:/data
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  rappi-data:
  backups:
  caddy_data:
  caddy_config:
