#cloud-config
# Primer arranque de la máquina: Docker con el plugin compose, la web abierta en el firewall del sistema y la zona
# horaria de Chile. El despliegue del MVP sigue en docs/despliegue.md (el código va en /opt/rappi).
# Todo va en un script que se detiene en el primer error: /var/lib/cloud/instance/rappi-listo queda solo si Docker y
# compose responden (si no, `cloud-init status` da error y el detalle está en /var/log/cloud-init-output.log).
timezone: America/Santiago
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - unattended-upgrades

write_files:
  - path: /usr/local/sbin/rappi-primer-arranque.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail
      # La IP pública (la reservada) se asocia después de crear la máquina, y unattended-upgrades puede tener apt tomado
      # al arrancar: lo que usa la red o apt se reintenta hasta 10 minutos.
      reintentar() {
        for _ in $(seq 1 60); do
          "$@" && return 0
          sleep 10
        done
        return 1
      }
      # Docker Engine y compose desde el repositorio oficial de Docker.
      install -m 0755 -d /etc/apt/keyrings
      reintentar curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
      echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $codename stable" \
        > /etc/apt/sources.list.d/docker.list
      reintentar apt-get update
      reintentar apt-get install -y ca-certificates curl git unattended-upgrades \
        docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      usermod -aG docker ubuntu
      # Las imágenes de Ubuntu de OCI traen iptables que rechaza todo lo que no es SSH: se abren 80 y 443 antes del
      # rechazo.
      iptables -I INPUT 5 -p tcp --dport 443 -m state --state NEW -j ACCEPT
      iptables -I INPUT 5 -p tcp --dport 80 -m state --state NEW -j ACCEPT
      netfilter-persistent save
      install -d -m 0755 /opt/rappi /etc/rappi
      docker version
      docker compose version
      touch /var/lib/cloud/instance/rappi-listo

runcmd:
  - [bash, /usr/local/sbin/rappi-primer-arranque.sh]
