<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mochi MVP · Presentación</title>
<style>
  :root {
    --bg: #e6e6ea;
    --panel: #ffffff;
    --ink: #161616;
    --ink-2: #4b4b4b;
    --ink-3: #8a8a90;
    --line: #d9d9de;
    --accent: #ff441f;
    --accent-soft: #fff1ea;
    --accent-deep: #8f2c16;
    --chapter-bg: #efe8fb;
    --chapter-ink: #5a3596;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display: grid;
    grid-template-columns: 264px minmax(0, 1fr) 264px;
    height: 100dvh;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  .side { display: flex; flex-direction: column; gap: 10px; padding: 18px 16px; min-height: 0; overflow-y: auto; }
  .side h2 { margin: 4px 4px 0; font-size: 13px; font-weight: 600; color: var(--ink-3); }
  .controls h2:first-child { margin-top: 0; }

  /* Izquierda: el MVP y los controles de su demo (vista, persona, simular) */
  .brand {
    display: flex; align-items: baseline; gap: 8px; padding: 12px 18px; border-radius: var(--radius);
    background: var(--accent); color: #fff; box-shadow: 0 8px 24px #ff441f40;
  }
  .brand .num { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .brand .name { font-size: 15px; opacity: .9; }

  .controls { display: flex; flex-direction: column; gap: 8px; }
  .controls[hidden], .replay[hidden], .readout[hidden] { display: none; }
  .modes { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: var(--radius); background: var(--panel); }
  .mode {
    flex: 1 1 auto; padding: 8px 10px; border-radius: 99px;
    font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
    transition: background .2s, color .2s;
  }
  .mode.is-active { background: var(--ink); color: #fff; }
  .replay {
    align-self: flex-start; padding: 6px 12px; border-radius: 99px; background: var(--accent-soft);
    color: var(--accent-deep); font-size: 13px; font-weight: 600; text-align: left;
  }
  .readout {
    margin: 0; padding: 6px 10px; border-radius: 10px; background: var(--accent-soft);
    color: var(--accent-deep); font-size: 12px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere;
  }
  .sims { display: flex; flex-direction: column; gap: 5px; }
  .persona, .sim {
    width: 100%; padding: 7px 12px; border-radius: 12px; background: var(--panel);
    text-align: left; font-size: 14px; font-weight: 600; line-height: 1.25;
    border: 2px solid transparent; transition: border-color .2s, background .2s, transform .15s;
  }
  .persona:active { transform: scale(.97); }
  .persona.is-active { border-color: var(--accent); background: var(--accent-soft); }
  /* Los perfiles de gusto, primero: fichas con su emoji en dos columnas */
  .tastes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .persona.taste {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    min-height: 60px; padding: 7px 6px; border-radius: 14px; text-align: center;
    box-shadow: 0 1px 0 #0000000a, 0 4px 14px #0000000d;
  }
  .persona.taste:only-child, .persona.taste:last-child:nth-child(odd) { grid-column: 1 / -1; flex-direction: row; min-height: 42px; }
  .taste-emoji { font-size: 24px; line-height: 1; }
  .taste-name { font-size: 13.5px; font-weight: 700; }
  /* Las otras personas: compactas, dos columnas, hasta dos líneas */
  .personas { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .personas .persona { min-height: 38px; padding: 5px 9px; border-radius: 10px; font-size: 12px; line-height: 1.2; }
  .sim { font-weight: 500; }
  .sim.is-danger { color: var(--accent-deep); }
  .sim-box summary {
    margin: 6px 4px 0; font-size: 13px; font-weight: 600; color: var(--ink-3); cursor: pointer; list-style-position: inside;
  }
  .sim-box .sims { margin-top: 8px; }

  /* Centro: el prototipo en su iframe, tal cual */
  .stage { position: relative; min-width: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* Derecha: panel de negocio, recorrido y Parar; el texto de abajo tiene alto fijo para que los botones no salten */
  .right { justify-content: safe center; }
  .play {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 8px 24px #ff441f40; transition: transform .15s, opacity .2s;
  }
  .play:active { transform: scale(.98); }
  .play[aria-pressed="true"] { background: var(--panel); color: var(--accent-deep); box-shadow: 0 6px 20px #0000000d; }
  .tour-picks { display: flex; flex-direction: column; gap: 5px; margin: 2px 0 4px; }
  .tour-one {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; text-align: left;
    background: var(--chapter-bg); color: var(--chapter-ink);
    transition: background .2s, color .2s, transform .15s;
  }
  .tour-one .icon-play { border-width: 5px 0 5px 8px; }
  .tour-one:active { transform: scale(.98); }
  .tour-one[aria-pressed="true"], .tour-one.is-now { background: var(--accent); color: #fff; }
  .status {
    margin: 6px 4px 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); height: 7.5em; overflow: hidden;
  }
  .status strong { display: block; color: var(--ink); font-size: 15px; }
  .stop {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px; border-radius: var(--radius);
    background: var(--ink); color: #fff; font-size: 17px; font-weight: 700;
    transition: opacity .2s, transform .15s;
  }
  .stop:active { transform: scale(.98); }
  .stop:disabled { opacity: .3; cursor: default; }
  .icon { width: 14px; height: 14px; display: inline-block; flex: none; }
  .icon-play { width: 0; height: 0; border-style: solid; border-width: 8px 0 8px 13px; border-color: transparent transparent transparent currentColor; }
  .icon-stop { background: currentColor; border-radius: 3px; }

  /* Panel de negocio: tarjeta destacada arriba de los botones de la derecha y vista grande encima */
  .biz {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 10px;
    padding: 14px; border-radius: var(--radius); background: var(--ink); color: #fff;
    text-align: left; box-shadow: 0 10px 28px #16161640;
    transition: transform .15s, opacity .2s;
  }
  .biz:active { transform: scale(.98); }
  .biz-icon {
    flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--accent);
    display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 11px 10px;
  }
  .biz-icon i { width: 5px; border-radius: 2px; background: #fff; }
  .biz-icon i:nth-child(1) { height: 40%; }
  .biz-icon i:nth-child(2) { height: 100%; }
  .biz-icon i:nth-child(3) { height: 65%; }
  .biz strong { display: block; font-size: 17px; white-space: nowrap; }
  .biz small { display: block; margin-top: 2px; font-size: 13px; line-height: 1.3; color: #ffffffb3; }
  .biz-backdrop {
    position: fixed; inset: 0; z-index: 30; background: #16161659;
    display: flex; padding: 20px;
  }
  .biz-backdrop[hidden] { display: none; }
  .biz-sheet {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    border-radius: var(--radius); background: var(--panel); overflow: hidden;
    box-shadow: 0 24px 80px #16161659;
  }
  .biz-bar { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 20px; border-bottom: 1px solid var(--line); }
  .biz-bar strong { font-size: 16px; }
  .biz-bar span { color: var(--ink-3); font-size: 14px; }
  .biz-close {
    margin-left: auto; padding: 9px 16px; border-radius: 99px;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 700;
  }
  .biz-frame { flex: 1; position: relative; }
  .biz-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* El «mouse» del recorrido */
  .cursor {
    position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none;
    width: 28px; height: 28px; opacity: 0;
    transform: translate(-100px, -100px);
    transition: opacity .3s;
    filter: drop-shadow(0 2px 3px #00000059);
  }
  .cursor.is-on { opacity: 1; }
  .ripple {
    position: fixed; z-index: 39; pointer-events: none; width: 44px; height: 44px;
    margin: -22px 0 0 -22px; border-radius: 50%; border: 3px solid var(--accent);
    animation: ripple .55s ease-out forwards;
  }
  @keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .ripple { animation-duration: .01s; }
  }
  @media (max-width: 1100px) {
    body { grid-template-columns: 220px minmax(0, 1fr) 220px; }
    .brand .num { font-size: 19px; }
  }
</style>
</head>
<body>
  <aside class="side left">
    <div class="brand"><span class="num">MVP</span><span class="name">Agente Mochi</span></div>
    <div class="controls" id="modes-box" hidden>
      <h2>Vista</h2>
      <div class="modes" id="modes"></div>
      <button class="replay" id="replay" hidden>↺ Repetir escena</button>
    </div>
    <div class="controls" id="personas-box" hidden>
      <h2>Perfil de gusto</h2>
      <div class="tastes" id="tastes"></div>
      <h2>Otras personas</h2>
      <div class="personas" id="personas"></div>
      <p class="readout" id="readout" hidden></p>
    </div>
    <details class="controls sim-box" id="sim-box" hidden>
      <summary>Simular</summary>
      <div class="sims" id="sim"></div>
    </details>
  </aside>

  <main class="stage" id="stage"></main>

  <aside class="side right">
    <button class="biz" id="biz-open">
      <span class="biz-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><strong>Panel de negocio</strong><small>Lo que ve Rappi del MVP</small></span>
    </button>
    <button class="play" id="play" aria-pressed="false"><span class="icon icon-play"></span><span id="play-label">Recorrido automático</span></button>
    <div class="tour-picks">
      <h2>O recorre una parte</h2>
      <div class="tour-picks" id="chapters"></div>
    </div>
    <button class="stop" id="stop" disabled><span class="icon icon-stop"></span>Parar</button>
    <p class="status" id="status">Navega con tu mouse o deja que el recorrido muestre el MVP.</p>
  </aside>

  <div class="biz-backdrop" id="biz" hidden>
    <div class="biz-sheet" role="dialog" aria-label="Panel de negocio">
      <div class="biz-bar">
        <strong>Panel de negocio</strong><span>Lo que ve Rappi del MVP</span>
        <button class="biz-close" id="biz-close">Cerrar ✕</button>
      </div>
      <div class="biz-frame" id="biz-frame"></div>
    </div>
  </div>

  <svg class="cursor" id="cursor" viewBox="0 0 28 28" aria-hidden="true">
    <path d="M5 3 L5 23 L10 18 L13.5 26 L17 24.5 L13.5 16.8 L20.5 16.8 Z" fill="#161616" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>

<script>const PROTOS = /*PROTOS*/null;</script>
<script>/*RECORRIDO*/</script>
</body>
</html>
