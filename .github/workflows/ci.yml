name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lee el repo: ningún job publica ni escribe en GitHub.
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida anterior; las de main terminan todas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rappi-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rappi-scraper

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie  # la de deploy/docker-compose.yml (Dependabot no sube las del CI)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/rappi_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rappi-scraper/pyproject.toml
            rappi-ia/requirements.lock.txt

      - name: Instalar
        run: python -m pip install -c ../rappi-ia/requirements.lock.txt -e ".[dev]"  # mismas versiones que rappi-ia

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests (unitarios + integración contra Postgres)
        run: python -m pytest

  rappi-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rappi-ia

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie  # trae unaccent (contrib) para la búsqueda sin tildes
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappi_ia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/rappi_ia_test
      RAPPI_IA_LIGHT: "1"  # sin modelos: los tests usan un embedder falso determinista

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rappi-ia/pyproject.toml
            rappi-ia/requirements.lock.txt
            rappi-scraper/pyproject.toml

      - name: Instalar (sin extras de modelos)
        run: python -m pip install -c requirements.lock.txt -e ../rappi-scraper -e ".[api,dev]"  # las versiones del lock

      # pg_dump, pg_restore y psql 17, los de la base (los del runner pueden ser de otra versión): el test de punta a
      # punta de `dump-entrega` los usa, y sin ellos se salta.
      - name: Cliente de Postgres 17
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Tests (unitarios + integración contra Postgres)
        run: python -m pytest

  prototipo-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototipo-app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc  # jsdom y vitest piden Node ≥ 22.22 o ≥ 24.15
          cache: npm
          cache-dependency-path: prototipo-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src scripts
      - run: npm test
      - run: npm run build

  dashboard-empresa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard-empresa

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard-empresa/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src scripts
      - run: npm test
      - run: npm run build

  # Los builds que se despliegan (app en /api, panel bajo /panel/) no llevan rastros de desarrollo: ni localhost, ni :8000,
  # ni los textos de `make mvp` (scripts/check-dist.sh).
  build-produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            prototipo-app/package-lock.json
            dashboard-empresa/package-lock.json

      - run: npm --prefix prototipo-app ci
      - run: npm --prefix dashboard-empresa ci
      - name: Construir la app
        run: npm --prefix prototipo-app run build
        env:
          VITE_API_URL: /api
      - name: Construir el panel
        run: npm --prefix dashboard-empresa run build
        env:
          VITE_API_URL: /api
          PANEL_BASE: /panel/
      - name: Revisar que dist/ no tenga rastros de desarrollo
        run: scripts/check-dist.sh

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck ya viene en las imágenes de ubuntu-latest.
      - name: shellcheck
        run: shellcheck -x scripts/*.sh rappi-scraper/scripts/*.sh rappi-ia/scripts/*.sh deploy/*.sh deploy/db/*.sh deploy/scripts/*.sh

  # Claves, tokens y contraseñas en los archivos versionados del commit (git archive: sin .git ni lo ignorado), con
  # gitleaks en una versión fija. Solo lee el repo. Las excepciones, revisadas una por una, en .github/gitleaks.toml.
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: gitleaks
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/arbol"
          mkdir -p "$tree"
          git archive HEAD | tar -x -C "$tree"
          docker run --rm -w /repo -v "$tree:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir . --config .github/gitleaks.toml --redact --no-banner --verbose

  # El stack de deploy/ de punta a punta, como en un servidor: construye las imágenes (la API sin hornear el modelo,
  # BAKE_MODEL=0: lo descarga al arrancar), levanta Postgres con sus roles, restaura como rappi_owner un dump del
  # catálogo de prueba (seed-demo, inventado), deja que migrate corra deploy-migrate y pasa deploy/smoke.sh contra Caddy
  # con DOMAIN=localhost (su CA interna). Las claves son desechables, generadas aquí.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: deploy/.env.example arma el stack
        run: RAPPI_ENV_FILE="$PWD/deploy/.env.example" docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config -q

      - name: Archivo de entorno de prueba
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/rappi.env"
          gate=$(openssl rand -hex 16)
          super=$(openssl rand -hex 24)
          owner=$(openssl rand -hex 24)
          api=$(openssl rand -hex 24)
          echo "::add-mask::$gate"
          hash=$(docker run --rm caddy:2.11.7-alpine caddy hash-password --plaintext "$gate")
          cat > "$env_file" <<EOF
          DOMAIN=localhost
          BASIC_AUTH_USER=ci
          BASIC_AUTH_HASH='$hash'
          POSTGRES_PASSWORD=$super
          POSTGRES_DB=rappi
          RAPPI_OWNER_PASSWORD=$owner
          RAPPI_API_PASSWORD=$api
          DATABASE_URL_OWNER=postgresql://rappi_owner:$owner@db:5432/rappi
          DATABASE_URL_API=postgresql://rappi_api:$api@db:5432/rappi
          API_SECRET=$(openssl rand -hex 32)
          API_ENABLE_ANALYTICS=0
          WITH_PANEL=0
          API_WORKERS=1
          API_POOL_MAX=10
          LLM_DAILY_CALL_CAP=0
          ANTHROPIC_API_KEY=
          TYPESAFE_API_KEY=
          RESTIC_REPOSITORY=
          RESTIC_PASSWORD=
          # Solo en el CI: la imagen no trae el modelo (BAKE_MODEL=0) y la API lo descarga al arrancar.
          HF_HUB_OFFLINE=0
          EOF
          {
            echo "RAPPI_ENV_FILE=$env_file"
            echo "BASIC_AUTH_PASSWORD=$gate"
            echo "SEED_URL=postgresql://postgres:$super@db:5432/rappi_ia_test"
            echo "COMPOSE=docker compose --env-file $env_file -f deploy/docker-compose.yml"
          } >> "$GITHUB_ENV"

      - name: Construir las imágenes (api, jobs y web)
        run: $COMPOSE build --build-arg BAKE_MODEL=0

      - name: Base vacía con los roles (init-roles.sh)
        run: $COMPOSE up -d --wait db

      # Como el primer despliegue: un dump restaurado como rappi_owner (sin dueño ni permisos del origen). El comentario
      # de las extensiones se salta: las creó el superusuario y rappi_owner no puede cambiarlo.
      - name: Catálogo de prueba en un dump, restaurado como rappi_owner
        run: |
          set -euo pipefail
          $COMPOSE exec -T db createdb -U postgres rappi_ia_test
          $COMPOSE run --rm --no-deps -e DATABASE_URL_TEST="$SEED_URL" migrate rappi-ia seed-demo
          $COMPOSE exec -T db sh -c 'pg_dump -U postgres -Fc -f /tmp/demo.dump rappi_ia_test \
            && pg_restore -l /tmp/demo.dump | grep -v "COMMENT - EXTENSION" > /tmp/demo.list \
            && PGPASSWORD="$RAPPI_OWNER_PASSWORD" pg_restore -h 127.0.0.1 -U rappi_owner -d "$POSTGRES_DB" \
                 --no-owner --no-privileges --exit-on-error -L /tmp/demo.list /tmp/demo.dump'

      - name: Levantar el stack (migrate, api y web)
        run: |
          set -euo pipefail
          $COMPOSE up -d
          for _ in $(seq 1 90); do
            status=$($COMPOSE ps --format '{{.Service}} {{.Status}}')
            if grep -q '^api .*(healthy)' <<<"$status" && grep -q '^web .*(healthy)' <<<"$status"; then
              break
            fi
            sleep 10
          done
          $COMPOSE ps -a
          test "$($COMPOSE ps -a --format '{{.ExitCode}}' migrate)" = 0
          $COMPOSE logs --no-color migrate

      - name: deploy/smoke.sh https://localhost
        run: deploy/smoke.sh https://localhost

      # Sin internet hacia huggingface.co la API sigue lista: con HF_HUB_OFFLINE=1 (lo de la imagen) el modelo carga del
      # caché en el commit fijado, sin consultar la red.
      - name: El modelo carga sin red (HF_HUB_OFFLINE=1)
        run: |
          $COMPOSE exec -T -e HF_HUB_OFFLINE=1 api python -c \
            "from rappi_ia.embeddings.models import E5Embedder; print('modelo', E5Embedder().dim)"

      # El servicio jobs: pg_dump 17 con la base, el volumen de respaldos y el candado de descargas en la base.
      - name: Trabajos (rappi backup en el volumen de respaldos)
        run: |
          set -euo pipefail
          $COMPOSE --profile jobs run --rm jobs sh -c 'pg_dump --version && restic version && make --version | head -n 1'
          $COMPOSE --profile jobs run --rm jobs rappi backup
          $COMPOSE --profile jobs run --rm jobs sh -c 'ls -l /data/backups/rappi_*.dump'

      - name: Registros del stack
        if: failure()
        run: $COMPOSE logs --no-color --tail 300

  # La única prueba de punta a punta (app + panel + API + base): lo mismo que `make mvp-check` en un equipo local, con Chrome y
  # Postgres de la imagen. Sin modelos (RAPPI_IA_LIGHT=1: embeddings falsos y redacción por plantilla).
  mvp-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rappi_ia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/rappi_ia_test
      RAPPI_IA_LIGHT: "1"
      MVP_CHECK_ARTIFACTS: ${{ github.workspace }}/mvp-check-artifacts  # capturas de lo que falle

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rappi-ia/pyproject.toml
            rappi-ia/requirements.lock.txt
            rappi-scraper/pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            prototipo-app/package-lock.json
            dashboard-empresa/package-lock.json

      # El .venv que esperan los scripts (rappi-ia/.venv), sin los extras de modelos ni de desarrollo.
      - name: Instalar rappi-ia (sin modelos)
        working-directory: rappi-ia
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -c requirements.lock.txt -e ../rappi-scraper -e ".[api]"

      - name: Instalar la app y el panel
        run: |
          npm --prefix prototipo-app ci
          npm --prefix dashboard-empresa ci

      # Chrome ya viene en ubuntu-latest: se falla aquí, con claro motivo, si algún día deja de venir.
      - name: Chrome
        run: |
          google-chrome --version
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: make mvp-check
        run: make mvp-check

      - name: Capturas de lo que falló
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mvp-check-capturas
          path: mvp-check-artifacts
          if-no-files-found: ignore
          retention-days: 7
